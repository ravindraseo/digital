<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (Dark Navy) -->
    <linearGradient id="dr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#112d4e"/>
    </linearGradient>

    <!-- Vibrant Brand Orange Gradient -->
    <linearGradient id="dr-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7539"/>
      <stop offset="100%" stop-color="#ff5a1f"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Base with Smooth Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#dr-bg)"/>

  <!-- Crisp Modern Outer/Inner Border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>

  <!-- Upward SEO & Digital Growth Arrow (Top-Right) -->
  <g transform="translate(44, 9)">
    <path d="M 0 9 L 8 1 M 8 1 L 2 1 M 8 1 L 8 7" fill="none" stroke="url(#dr-orange)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bold DR Monogram with Shadow -->
  <g filter="url(#dr-shadow)">
    <!-- Letter 'D' in Crisp Pure White -->
    <path d="M 12 17 L 23 17 C 30 17 33.5 21 33.5 29 C 33.5 37 30 47 23 47 L 12 47 Z M 18 22.8 L 18 41.2 L 22.2 41.2 C 26 41.2 27.6 37 27.6 29 C 27.6 21 26 22.8 22.2 22.8 Z" fill="#ffffff"/>

    <!-- Letter 'R' in Vibrant High-Conversion Orange -->
    <path d="M 32 17 L 43.5 17 C 49 17 52 19.5 52 24.5 C 52 28.5 49.5 31.5 45.5 32.5 L 53 47 L 46.5 47 L 39.8 33.5 L 37.8 33.5 L 37.8 47 L 32 47 Z M 37.8 22.5 L 37.8 28.5 L 42.5 28.5 C 45 28.5 46.5 27.2 46.5 25.5 C 46.5 23.8 45 22.5 42.5 22.5 Z" fill="url(#dr-orange)"/>
  </g>
</svg>
