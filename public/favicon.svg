<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#102b4c"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#dr-bg)"/>
  <!-- Subtle border for crisp definition -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <!-- DR Logo typography -->
  <text x="32" y="44" font-family="'Poppins', 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="31" font-weight="900" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#ffffff">D</tspan><tspan fill="#ff5a1f" dx="-1">R</tspan>
  </text>
</svg>